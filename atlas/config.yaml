name: "ATLAS"
version: "0.1.226"
slug: "atlas"
description: "ATLAS Administration and Home Assistant Plugins preview"
url: "https://github.com/rockbaer2007/atlas"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 4176
hassio_api: true
hassio_role: manager
panel_icon: mdi:view-dashboard-edit
webui: "http://[HOST]:[PORT:4176]/"
map:
  - config:rw
  - addons:rw
ports:
  4176/tcp: 4176
  4175/tcp: 4175
  4174/tcp: 4174
options:
  atlas_instance_id: "atlas-home-assistant"
  home_assistant_url: "http://homeassistant.local:8123"
  home_assistant_token: ""
  remember_home_assistant_token: false
  auto_connect_editor: false
  editor_start_mode: "simple"
  allow_addons_path: false
  allow_www_path: false
  allow_custom_components_path: false
  allow_parent_of_config_path: false
  terminal_enabled: false
  terminal_token: ""
  packages: []
  terminal_ssh_host: ""
  terminal_ssh_user: ""
  terminal_ssh_port: 22
  terminal_ssh_identity_file: ""
  terminal_ssh_known_hosts: ""
schema:
  atlas_instance_id: "str"
  home_assistant_url: "url"
  home_assistant_token: "password"
  remember_home_assistant_token: "bool"
  auto_connect_editor: "bool"
  editor_start_mode: "list(simple|expert)"
  allow_addons_path: "bool"
  allow_www_path: "bool"
  allow_custom_components_path: "bool"
  allow_parent_of_config_path: "bool"
  terminal_enabled: "bool"
  terminal_token: "password"
  packages:
    - str
  terminal_ssh_host: "str"
  terminal_ssh_user: "str"
  terminal_ssh_port: "int"
  terminal_ssh_identity_file: "str"
  terminal_ssh_known_hosts: "str"
