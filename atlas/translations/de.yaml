configuration:
  atlas_instance_id:
    name: "Atlas-Instanz-ID"
    description: "Stabile lokale Identitaet fuer verschluesselte Administration-Secrets."
  home_assistant_url:
    name: "Home-Assistant-URL"
    description: "URL deiner Home-Assistant-Instanz fuer Entity-, Status- und Ressourcenabfragen."
  home_assistant_token:
    name: "Home-Assistant-Token"
    description: "Long-Lived Access Token fuer ATLAS Administration. Home Assistant zeigt den Token maskiert an; ueber das Auge kann er bei Bedarf sichtbar gemacht werden."
  remember_home_assistant_token:
    name: "Token in ATLAS Administration uebernehmen"
    description: "Uebergibt den Token beim Start an ATLAS Administration, damit der Editor ihn nur als Session-Handoff erhalten kann."
  auto_connect_editor:
    name: "Card Editor automatisch verbinden"
    description: "Der Editor verbindet sich nach dem Administration-Handoff automatisch mit Home Assistant."
  allow_addons_path:
    name: "File Studio: /addons freigeben"
    description: "Erlaubt ATLAS File Studio Zugriff auf lokale Home-Assistant-Add-on-Ordner unter /addons. Standardmaessig aus Sicherheitsgruenden deaktiviert."
network:
  4176/tcp: "ATLAS App-Laufzeit"
  4175/tcp: "ATLAS Administration"
  4174/tcp: "ATLAS Card Editor"
